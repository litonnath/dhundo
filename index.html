<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#054291" />
    <title>Dhundo — find a mistri, driver or cook near you</title>
    <meta name="description" content="Dhundo finds you local masons, drivers, cooks, electricians, plumbers and material suppliers across India. Call them directly. No commission." />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dhundo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Dhundo — local help, near you" />
    <meta property="og:description" content="Mistri, driver, cook, electrician, plumber and more. Call them directly, no commission." />
    <meta property="og:type" content="website" />
    <link rel="preload" as="image" href="/logo-mark.png" />
    <!-- The first thing anyone sees while the app loads: the round logo on
         Dhundo blue, the same blue as Android's own launch screen, so the
         two join up instead of flashing a tile and then a blank page. -->
    <style>
      /* Pop-up sheets slide up from the bottom on a phone and sit in the
         middle of the screen on a computer. */
      @media (min-width:700px){
        [role="dialog"][style*="align-items: flex-end"]{align-items:center !important}
        [role="dialog"][style*="align-items: flex-end"]>div{border-radius:18px !important}
      }
      #splash{position:fixed;inset:0;z-index:9999;background:#054291;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:14px;transition:opacity .35s ease;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
      #splash.gone{opacity:0;pointer-events:none}
      #splash .logo{width:140px;height:140px;border-radius:50%;background:#fff;display:flex;align-items:center;
        justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,.25);animation:dhIn .5s ease-out both}
      #splash .logo img{width:98px;height:98px}
      #splash .w{font-size:40px;font-weight:900;letter-spacing:-1px;color:#fff;line-height:1;
        animation:dhIn .5s .08s ease-out both}
      #splash .w b{color:#F47B20;font-weight:900}
      #splash .s{font-size:15px;color:rgba(255,255,255,.85);font-style:italic;animation:dhIn .5s .16s ease-out both}
      #splash .bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:18px}
      #splash .bar i{display:block;width:40%;height:100%;border-radius:4px;background:#fff;
        animation:dhBar 1.1s ease-in-out infinite}
      @keyframes dhIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
      @keyframes dhBar{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
    </style>
  </head>
  <body style="margin:0">
    <div id="splash" aria-hidden="true">
      <div class="logo"><img src="/logo-mark.png" alt="" /></div>
      <div class="w">Dhund<b>o</b></div>
      <div class="s">Jo chahiye, paas mein dhoondo.</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
